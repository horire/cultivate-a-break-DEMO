<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>1日の振り返り | cultivate your break</title>

    <link rel="stylesheet" href="CSS/sanitize.css">
    <link rel="stylesheet" href="CSS/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap"
        rel="stylesheet">

    <script src="JavaScript/reflection.js" defer></script>
</head>

<body class="yusei-magic-regular reflection-page">

    <header class="reflection-page-header">
        <h1>cultivate your break</h1>
        <p>今日の休憩を振り返りましょう</p>
        <a href="index.html">タイマーに戻る</a>
    </header>

    <section class="reflection-section">

        <div class="reflection-card">
            <div class="reflection-tag">1日の振り返り</div>

            <div class="reflection-left">
                <h2 class="reflection-title">作業時間を入力して分析</h2>

                <div class="input-group">
                    <input type="number" id="workTimeInput"
                        class="work-input" min="1" placeholder="120">
                    <span class="unit-text">分</span>
                </div>

                <button type="button" id="analyzeBtn" class="analyze-button">
                    分析する
                </button>

                <p class="reflection-note">
                    ＊分析を開始するとその日の記録がリセットされます
                </p>
            </div>
        </div>

        <div class="reflection-right">

            <div class="stats-table">

                <div class="stat-col">
                    <span class="stat-label">作業時間</span>
                    <div class="stat-value">
                        <span id="displayWorkTime">0</span>
                        <span class="unit">分</span>
                    </div>
                </div>

                <div class="stat-col">
                    <span class="stat-label">休憩時間</span>
                    <div class="stat-value" id="displayBreakTime">
                        0<span class="unit">分</span>0<span class="unit">秒</span>
                    </div>
                </div>

                <div class="stat-col">
                    <span class="stat-label">休憩率</span>
                    <div class="stat-value highlight" id="displayBreakRate">
                        0.0<span class="unit">%</span>
                    </div>
                </div>

            </div>

            <div class="feedback-box">
                <div class="feedback-icon"></div>

                <div class="feedback-content">
                    <h3 id="feedbackTitle" class="feedback-title">
                        作業時間を入力して分析してください。
                    </h3>

                    <p id="feedbackText" class="feedback-text">
                        計測された休憩時間をもとに1日のバランスを分析します。
                    </p>
                </div>
            </div>

        </div>

    </section>

    <footer class="site-footer">
        <p>&copy; 2026 cultivate your break</p>
    </footer>

</body>
</html>
