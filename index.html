<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>休憩タイマー</title>

    <link rel="stylesheet" href="CSS/sanitize.css">
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
    <script src="JavaScript/script.js" defer></script>
</head>


<body class="yusei-magic-regular">


    <!-- =========================
     ローディング
========================== -->
    <div id="loadingScreen" class="loading-screen">

        <div class="loading-content">

            <div class="loading-flower">
                <img src="images/siteIcon.png" alt="花の画像">
            </div>

            <p class="loading-text">
                cultivate a break
            </p>

            <div class="loading-bar">
                <span id="loadingBar"></span>
            </div>

        </div>

    </div>


    <!-- =========================
     トップ画像
========================== -->
    <section id="topVisual" class="top-visual">

        <img src="images/topImg.png" alt="cultivate a break" class="top-visual-image">

    </section>


    <!-- ========================================
         メインコンテンツ
    ========================================= -->

    <div class="top-layout">

        <main class="timer-container current-break">



            <button id="menuToggle" class="menu-toggle" type="button" aria-label="休憩メニューを開く" aria-expanded="false">
                <span class="menu-tap">TAP</span>
                <span id="menuArrow">→</span>
            </button>


            <!-- 現在の休憩 -->
            <div class="current-break current-label">
                現在の休憩
            </div>


            <!-- 休憩内容 -->
            <h1 class="break-name" id="currentBreakName">
                休憩内容を選択してください
            </h1>


            <!-- 推奨時間 -->
            <div class="recommended current-time">
                <span>推奨</span>
                <span id="currentBreakTime">10～15分</span>
            </div>


            <!-- タイマー -->
            <div class="timer-circle">

                <div class="timer-content">

                    <div id="timer">
                        00:00
                    </div>

                    <div id="timer-status">
                        休憩開始
                    </div>

                </div>

            </div>


            <!-- 操作ボタン -->
            <div class="controls">

                <!-- スタート -->
                <button id="startButton" class="control-button start-button" type="button" aria-label="タイマー開始">
                    ▶
                </button>


                <!-- 一時停止 -->
                <button id="pauseButton" class="control-button pause-button" type="button" aria-label="タイマー一時停止">
                    Ⅱ
                </button>


                <!-- リセット -->
                <button id="resetButton" class="control-button reset-button" type="button" aria-label="タイマーリセット">
                    ◼︎
                </button>

            </div>


            <!-- 休憩の効果 -->
            <section class="break-effect-box">

                <h2>
                    休憩の効果
                </h2>

                <p id="currentBreakEffect">
                    休憩内容が選択されていません。
                </p>

            </section>

        </main>





        <!-- ========================================
             花の成長
        ========================================= -->

        <figure>

            <figcaption id="illust-title">
                花の成長
            </figcaption>

            <img src="images/イラスト土.jpg" alt="花の画像" id="flowerImg" class="flowerImg">

        </figure>

    </div>


    <!-- ========================================
         休憩メニュー
         左側からスライド表示
    ========================================= -->

    <aside id="breakMenu" class="break-menu" aria-hidden="true">

        <!-- 休憩内容を選択 -->
        <section class="break-selection">

            <div class="section-label">
                休憩内容を選択
            </div>

            <div id="breakList" class="break-list">
                <!-- JavaScriptで生成 -->
            </div>

        </section>


        <!-- 自由追加 -->
        <section class="add-break">

            <div class="section-label">
                休憩内容自由追加
            </div>

            <div class="add-form">

                <input type="text" id="breakInput" maxlength="20" aria-label="休憩内容">

                <button id="addButton" type="button" aria-label="休憩を追加">
                    →
                </button>

            </div>

        </section>


        <!-- 今日の休憩履歴 -->
        <section class="break-history">

            <h2>
                今日の休憩履歴
            </h2>

            <div id="historyList">
                <!-- JavaScriptで生成 -->
            </div>

        </section>

    </aside>


</body>

<footer class="site-footer">
    <p>&copy; 2026 Cultivate a Break</p>
</footer>

</html>
